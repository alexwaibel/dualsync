name: Publish dev container

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .devcontainer/**
      - .github/workflows/publish-devcontainer.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-devcontainer
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, check, and publish dev container
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3
        with:
          imageName: ghcr.io/alexwaibel/dualsync-devcontainer
          imageTag: git-${{ github.sha }},cache
          cacheFrom: ghcr.io/alexwaibel/dualsync-devcontainer:cache
          push: always
          runCmd: ./scripts/dualsync check
