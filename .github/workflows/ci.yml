name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Build dev container and run checks
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3
        with:
          imageName: ghcr.io/alexwaibel/dualsync-devcontainer
          cacheFrom: ghcr.io/alexwaibel/dualsync-devcontainer:cache
          push: never
          runCmd: ./scripts/dualsync check
