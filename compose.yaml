services:
  dev:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
      cache_from:
        - ghcr.io/alexwaibel/dualsync-devcontainer:cache
    image: dualsync-devcontainer
    init: true
    environment:
      DUALSYNC_IN_CONTAINER: "1"
      DUALSYNC_PROBE_URL: "${DUALSYNC_PROBE_URL:-https://demo.romm.app/api/heartbeat}"
    volumes:
      - .:/work
    working_dir: /work
