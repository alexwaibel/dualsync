services:
  dsi:
    build:
      context: .
      dockerfile: containers/dsi/Dockerfile
    image: dualsync-dsi-dev
    init: true
    environment:
      DUALSYNC_PROBE_URL: "${DUALSYNC_PROBE_URL:-https://demo.romm.app/api/heartbeat}"
    user: "${DUALSYNC_UID:-1000}:${DUALSYNC_GID:-1000}"
    volumes:
      - .:/work
    working_dir: /work

  tools:
    build:
      context: .
      dockerfile: containers/tools/Dockerfile
    image: dualsync-tools-dev
    init: true
    user: "${DUALSYNC_UID:-1000}:${DUALSYNC_GID:-1000}"
    volumes:
      - .:/work
    working_dir: /work
